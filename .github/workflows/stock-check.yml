name: Check stocks

on:
  # Scheduled runs now come from Supabase Cron (job "stock-check", every 5 minutes in market hours;
  # see supabase/migrations). This workflow is kept for running a check by hand from GitHub.
  workflow_dispatch:

jobs:
  check-stocks:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger stock check
        run: |
          curl --fail-with-body \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://stock-alerts-alpha.vercel.app/api/cron/stocks
